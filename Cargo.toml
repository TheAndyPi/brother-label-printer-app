[package]
name = "brother-label-printer"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Anderson Chan <anderson.chan@stonybrook.edu>"]
description = "Desktop application for printing labels with Brother QL network printers"
repository = "https://github.com/TheAndyPi/brother-label-printer-app"
license = "UNLICENSED"
publish = false
build = "build.rs"

[dependencies]
brother_ql = "=3.0.5"
directories = "=6.0.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
slint = "=1.17.1"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
i-slint-backend-testing = "=1.17.1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
